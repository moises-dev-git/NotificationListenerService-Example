pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    plugins {
        id 'com.android.application' version '8.2.2'
        // id 'org.jetbrains.kotlin.android' version '2.0.0' // uncomment if using Kotlin
